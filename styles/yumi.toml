  { preset = "volume", caption = "音", width = 84 },
  { preset = "mute", caption = "消音" },
  { plugin = "yumi-clock", width = 200, options = { format = "%H:%M · %d.%m", px = 22, font = "Noto Serif CJK JP", command = "qs -c yumi ipc call menu center calendar" } },
]

# ── kitty ───────────────────────────────────────────────────────────────────────────────────────────
[layers.app-kitty]
items = [
  { icon = "󰕮", layer = "control", width = 84, style = "subtle" },                          # главный слой (музыка, папка)
  "gap:8",
  { icon = "󰝜", keys = ["LeftCtrl", "LeftShift", "T"] },                                    # новая вкладка  Ctrl+Shift+T
  { icon = "󰅁", keys = ["LeftCtrl", "LeftShift", "Left"] },                                 # вкладка левее  Ctrl+Shift+←
  { icon = "󰅂", keys = ["LeftCtrl", "LeftShift", "Right"] },                                # вкладка правее  Ctrl+Shift+→
  { icon = "󰭌", keys = ["LeftCtrl", "LeftShift", "Q"] },                                    # закрыть вкладку  Ctrl+Shift+Q
  { icon = "󰯌", keys = ["LeftCtrl", "LeftShift", "Enter"] },                                # новое окно рядом  Ctrl+Shift+Enter
  { icon = "󰄷", keys = ["LeftCtrl", "LeftShift", "C"] },                                    # копировать  Ctrl+Shift+C
  { icon = "󰱖", keys = ["LeftCtrl", "LeftShift", "V"] },                                    # вставить  Ctrl+Shift+V
  { icon = "󰋚", keys = ["LeftCtrl", "LeftShift", "H"] },                                    # прокрутка в пейджере  Ctrl+Shift+H
  { icon = "󰧳", keys = ["LeftCtrl", "LeftShift", "Minus"] },                                # шрифт меньше  Ctrl+Shift+−
  { icon = "󰧴", keys = ["LeftCtrl", "LeftShift", "Equal"] },                                # шрифт больше  Ctrl+Shift+=
  "gap:8",
  { icon = "󰒮", keys = ["PreviousSong"], width = 84 },
  { icon = "󰐎", keys = ["PlayPause"], width = 84 },
  { icon = "󰒭", keys = ["NextSong"], width = 84 },
  { preset = "volume", caption = "音", width = 84 },
  { preset = "mute", caption = "消音" },
  { plugin = "yumi-clock", width = 200, options = { format = "%H:%M · %d.%m", px = 22, font = "Noto Serif CJK JP", command = "qs -c yumi ipc call menu center calendar" } },
]
