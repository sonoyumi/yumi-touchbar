  { icon = "󰘳", keys = ["LeftCtrl", "LeftShift", "P"], width = 84 },                             # палитра команд
  { icon = "󰆍", keys = ["LeftCtrl", "Grave"], width = 84 },                                      # терминал
  { icon = "󱎸", keys = ["LeftCtrl", "LeftShift", "F"], width = 84 },                             # поиск по проекту
  "gap:14",
  { icon = "󰃤", label = "Запуск", keys = ["F5"], width = 150 },
  { label = "Стоп", keys = ["LeftShift", "F5"], width = 100 },
  { label = "Шаг", keys = ["F10"], width = 84 },
  { label = "Вход", keys = ["F11"], width = 84 },
  { label = "Выход", keys = ["LeftShift", "F11"], width = 84 },
  "gap:14",
  { icon = "󰘬", label = "Git", keys = ["LeftCtrl", "LeftShift", "G"], width = 230 },             # ВРЕМЕННО: будет плагин yumi-git (ветка, изменения)
