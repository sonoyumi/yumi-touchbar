  { icon = "󱁊", keys = ["LeftCtrl", "G"], width = 84 },                                          # граф
  { icon = "󰘳", keys = ["LeftCtrl", "P"], width = 84 },                                          # палитра команд
  "gap:14",
  { preset = "volume", caption = "音", width = 84 },
