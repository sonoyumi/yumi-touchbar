]

[layers.app-obsidian]
items = [
  { icon = "󰕮", layer = "control", width = 84, style = "subtle" },                               # ВРЕМЕННО: будет плагин yumi-wintitle (заметка)
  "flex",
  { icon = "󰁍", keys = ["LeftCtrl", "LeftAlt", "Left"], width = 85 },                            # назад
  { icon = "󰁔", keys = ["LeftCtrl", "LeftAlt", "Right"], width = 85 },                           # вперёд
  { icon = "󱎸", keys = ["LeftCtrl", "LeftShift", "F"], width = 84 },                             # поиск
  { icon = "󰮗", label = "Перейти", keys = ["LeftCtrl", "O"], width = 150 },
